# Docker Compose para el entorno de desarrollo de Innotrev

services:
  # --- Base de Datos PostgreSQL ---
  db:
    image: postgres:15-alpine
    container_name: innotrev_db
    restart: always
    environment:
      - POSTGRES_USER=innotrev_user
      - POSTGRES_PASSWORD=innotrev_password
      - POSTGRES_DB=innotrev_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innotrev_user -d innotrev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - innotrev-net

  # --- Broker de Mensajes Redis ---
  redis:
    image: redis:7-alpine
    container_name: innotrev_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innotrev-net

  # --- Backend API (FastAPI) ---
  backend:
    container_name: innotrev_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    # ELIMINAMOS EL RELOAD PARA AHORRAR RAM (Adiós Error 12)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/home/app
      - uploads_data:/home/app/uploads
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - innotrev-net

  # --- Worker de Celery ---
  celery_worker:
    container_name: innotrev_celery_worker
    build: ./backend
    restart: always
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./backend:/home/app
      - uploads_data:/home/app/uploads
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - innotrev-net

  # --- Programador de Tareas de Celery ---
  celery_beat:
    container_name: innotrev_celery_beat
    build: ./backend
    restart: always
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    volumes:
      - ./backend:/home/app
      - uploads_data:/home/app/uploads
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - innotrev-net

  # --- Frontend (React) ---
  frontend:
    container_name: innotrev_frontend
    build: ./frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - innotrev-net

# --- Volúmenes y Redes ---
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  innotrev-net:
    driver: bridge